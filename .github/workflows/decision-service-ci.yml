name: Decision Service CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/decision-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/decision-service/pom.xml

      - name: Check Docker
        run: docker info

      - name: Build and run tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: decision-service-test-reports
          path: services/decision-service/target/surefire-reports/
          if-no-files-found: ignore